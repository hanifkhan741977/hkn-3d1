<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offcut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;
  --ink:#f1efec;
  --mute:#8d8a86;
  --red:#b3121b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  color:var(--ink);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#art{
  position:absolute;
  width:1500px;height:1000px;
  transform-origin:0 0;
  background:radial-gradient(ellipse 70% 55% at 50% 40%, #18181a 0%, #0b0b0c 100%);
}
.ui{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.pill{
  height:34px;padding:0 20px;
  border:1px solid rgba(241,239,236,.6);
  border-radius:40px;
  display:inline-grid;place-items:center;
  transition:background .25s,color .25s;
}
.pill:hover{background:var(--ink);color:var(--bg)}
.dim{transition:opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s}
body.open .dim{opacity:.12;filter:blur(2px)}
body.open .dimmer{opacity:0;pointer-events:none}
body.open #cap{opacity:0}
#about{position:absolute;left:46px;top:46px}
#logo{
  position:absolute;left:50%;top:26px;transform:translateX(-50%);
  font-family:"UnifrakturMaguntia",serif;
  font-weight:400;font-size:64px;line-height:1;letter-spacing:.01em;
  color:var(--ink);
}
#contact{position:absolute;right:46px;top:46px}
#rail{
  position:absolute;left:150px;right:150px;top:254px;height:12px;
  border-radius:6px;
  background:linear-gradient(to bottom,#fafafa 0%,#b9bcc1 28%,#5d6066 55%,#a9adb3 78%,#e6e7e9 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.45);
}
#rail::before,#rail::after{
  content:"";position:absolute;width:16px;height:30px;border-radius:5px;top:-9px;
  background:linear-gradient(90deg,#8d9096,#f3f3f4 45%,#7a7d83);
}
#rail::before{left:-14px}
#rail::after{right:-14px}
#rack{position:absolute;left:0;top:0;width:1500px;height:1000px}
.g{
  position:absolute;top:236px;width:289px;height:300px;margin-left:-144.5px;
  perspective:900px;cursor:pointer;
  transition:left .75s cubic-bezier(.2,.8,.2,1);
}
.g i{
  position:absolute;inset:0;
  background-repeat:no-repeat;
  transform-origin:50% 4%;
  transform:rotateY(-74deg);
  filter:brightness(.82) drop-shadow(0 18px 18px rgba(0,0,0,.5));
  transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .75s;
}
.g.face i{
  transform:rotateY(0deg);
  filter:brightness(1) drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
#cap{
  position:absolute;top:552px;transform:translateX(-50%);
  text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mute);white-space:nowrap;pointer-events:none;
  opacity:0;
  transition:left .75s cubic-bezier(.2,.8,.2,1),opacity .35s;
}
#cap b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
#cap.on{opacity:1}
#avail{
  position:absolute;left:50%;top:790px;transform:translateX(-50%);
  transition:background .25s,color .25s,opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s;
}
#band{
  position:absolute;left:0;right:0;bottom:0;height:46px;
  background:var(--red);overflow:hidden;
  display:flex;align-items:center;
}
#band .track{
  display:flex;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:.14em;
  animation:mq 22s linear infinite;
}
#band .track span{padding-right:22px}
@keyframes mq{to{transform:translateX(-50%)}}
#det{position:absolute;inset:0;pointer-events:none}
body.open #det{pointer-events:auto}
#det .hit{position:absolute;inset:0}
#big2{
  position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;
  background-repeat:no-repeat;opacity:0;pointer-events:none;
}
#big{
  position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;
  background-repeat:no-repeat;opacity:0;
  transform-origin:50% 4%;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));
}
.arr{
  position:absolute;top:452px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(241,239,236,.5);
  display:grid;place-items:center;
  opacity:0;
  transition:opacity .4s ease .25s,background .2s,color .2s;
}
#prev{left:calc(50% - 300px)}
#next{left:calc(50% + 254px)}
.arr:hover{background:var(--ink);color:var(--bg)}
body.open .arr{opacity:1;pointer-events:auto}
#info{
  position:absolute;left:50%;top:770px;transform:translateX(-50%);
  text-align:center;opacity:0;
  transition:opacity .5s ease .25s;
}
body.open #info{opacity:1}
#num{font-size:11px;letter-spacing:.16em;color:var(--mute)}
#name{
  font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;
  font-size:40px;line-height:1.15;color:var(--ink);
  margin:8px 0 6px;
}
#price{font-size:13px;letter-spacing:.08em;color:var(--mute);margin-bottom:18px}
#close{
  position:absolute;right:46px;top:46px;opacity:0;
  transition:opacity .4s ease .25s;
}
body.open #close{opacity:1;pointer-events:auto}
body.mobile #art{width:780px;height:1300px}
body.mobile .ui{font-size:15px}
body.mobile #logo{font-size:84px;top:40px}
body.mobile #about{left:30px;top:56px}
body.mobile #contact{right:30px;top:56px}
body.mobile #close{right:30px;top:56px}
body.mobile #rail{left:40px;right:40px;top:300px;height:14px}
body.mobile .g{top:282px;pointer-events:none}
body.mobile .g i{pointer-events:auto;cursor:pointer}
body.mobile #cap{top:600px;font-size:14px}
body.mobile #avail{top:1090px}
body.mobile #big,body.mobile #big2{top:300px}
body.mobile .arr{top:520px}
body.mobile #info{top:840px}
body.mobile #num{font-size:13px}
body.mobile #price{font-size:15px}
body.mobile #band .track{font-size:16px}
</style>
</head>

  var ew = el.offsetWidth, eh = el.offsetHeight;
  var sx = ew / BW, sy = eh / CH;
  var xbox = (k % 5) * CW - PAD;
  var ybox = ROWY[Math.floor(k / 5)];
  el.style.backgroundImage = "url(\"" + SHEET + "\")";
  el.style.backgroundSize = (SW * sx) + "px " + (SH * sy) + "px";
  el.style.backgroundPosition = (-xbox * sx) + "px " + (-ybox * sy) + "px";
  el.style.clipPath = POLY[k];
}
function layout() {
  for (var k = 0; k < N; k++) {
    var x = CX + (k - (N - 1) / 2) * SLOT;
    if (hov >= 0 && k !== hov) x += Math.sign(k - hov) * OPEN;
    G[k].style.left = x + "px";
    G[k].classList.toggle("face", k === hov);
  }
  if (hov >= 0) {
    cap.style.left = G[hov].style.left;
    capName.textContent = PRODUCTS[hov].name;
    capPrice.textContent = PRODUCTS[hov].price;
    cap.classList.add("on");
  } else {
    cap.classList.remove("on");
  }
}
function fill(k) {
  var a = ("0" + (k + 1)).slice(-2), b = ("0" + N).slice(-2);
  numEl.textContent = a + " / " + b;
  nameEl.textContent = PRODUCTS[k].name;
  priceEl.textContent = PRODUCTS[k].price;
}
function openG(k) {
  if (open >= 0) return;
  open = k; hov = k; layout();
  var gx = parseFloat(G[k].style.left);
  big.getAnimations().forEach(function (a) { a.cancel(); });
  paint(big, k);
  fill(k);
  document.body.classList.add("open");
  big.animate([
    { transform: "translate(" + (gx - CX) + "px, -8px) scale(.61)", opacity: 1 },
    { transform: "none", opacity: 1 }
  ], { duration: 750, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
  G[k].style.visibility = "hidden";
}
function step(d) {
  if (open < 0) return;
  var from = open;
  open = (open + d + N) % N;
  fill(open);
  G[from].style.visibility = "";
  G[open].style.visibility = "hidden";
  hov = open; layout();
  paint(big2, from);
  big2.animate([
    { transform: "none", opacity: 1, filter: "blur(0px)" },
    { transform: "translateX(" + (-d * 120) + "px) scale(.94)", opacity: 0, filter: "blur(6px)" }
  ], { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)" });
  big.getAnimations().forEach(function (a) { a.cancel(); });
  paint(big, open);
  big.animate([
    { transform: "translateX(" + (d * 120) + "px) scale(.94)", opacity: 0, filter: "blur(6px)" },
    { transform: "none", opacity: 1, filter: "blur(0px)" }
  ], { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
}
function closeG() {
  if (open < 0) return;
  var k = open;
  var gx = parseFloat(G[k].style.left);
  big.animate([
    { transform: "none", opacity: 1 },
    { transform: "translate(" + (gx - CX) + "px, -8px) scale(.61)", opacity: 1 }
  ], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
  document.body.classList.remove("open");
  setTimeout(function () {
    G[k].style.visibility = "";
    big.getAnimations().forEach(function (a) { a.cancel(); });
    big.style.opacity = "0";
    open = -1; hov = -1; layout();
  }, 650);
}
for (var k = 0; k < N; k++) {
  (function (k) {
    var g = document.createElement("div");
    g.className = "g";
    var i = document.createElement("i");
    g.appendChild(i);
    rack.appendChild(g);
    paint(i, k);
    g.addEventListener("pointerenter", function (e) { if (e.pointerType === "touch") return; if (open < 0) { hov = k; layout(); } });
    g.addEventListener("pointerdown", function (e) { if (e.pointerType === "touch" && open < 0 && hov !== k) { hov = k; layout(); suppressClick = true; } });
    g.addEventListener("click", function () { if (suppressClick) { suppressClick = false; return; } openG(k); });
    G.push(g);
    GI.push(i);
  })(k);
}
rack.addEventListener("pointerleave", function (e) { if (e.pointerType === "touch") return; if (open < 0) { hov = -1; layout(); } });
document.getElementById("prev").addEventListener("click", function () { step(-1); });
document.getElementById("next").addEventListener("click", function () { step(1); });
document.getElementById("close").addEventListener("click", function () { closeG(); });
document.getElementById("hit").addEventListener("click", function () { closeG(); });
window.addEventListener("keydown", function (e) {
  if (open >= 0) {
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "Escape") closeG();
  } else {
    if (e.key === "ArrowRight") { hov = Math.min(N - 1, hov + 1); layout(); }
    else if (e.key === "ArrowLeft") { if (hov < 0) hov = N - 1; else hov = Math.max(0, hov - 1); layout(); }
    else if (e.key === "Enter") { if (hov >= 0) openG(hov); }
  }
});
(function () {
  var track = document.getElementById("track");
  var seq = ["OFFCUT", "\u2022", "LIMITED RUN", "\u2022", "NO RESTOCKS", "\u2022"];
  for (var r = 0; r < 16; r++) {
    for (var s = 0; s < seq.length; s++) {
      var sp = document.createElement("span");
      sp.textContent = seq[s];
      track.appendChild(sp);
    }
  }
})();
var BW_ = 1500, BH_ = 1000;
function fit() {
  var k = Math.min(window.innerWidth / BW_, window.innerHeight / BH_);
  art.style.transform = "scale(" + k + ")";
  art.style.left = ((window.innerWidth - BW_ * k) / 2) + "px";
  art.style.top = ((window.innerHeight - BH_ * k) / 2) + "px";
}
function repaintAll() {
  for (var k = 0; k < N; k++) paint(GI[k], k);
}
var lastMobile = null;
function syncMode() {
  var m = window.innerWidth <= 820 && window.innerHeight > window.innerWidth;
  if (m === lastMobile) { fit(); return; }
  lastMobile = m;
  document.body.classList.toggle("mobile", m);
  BW_ = m ? 780 : 1500;
  BH_ = m ? 1300 : 1000;
  SLOT = m ? 64 : 108;
  OPEN = m ? 120 : 86;
  CX = m ? 390 : 750;
  fit();
  repaintAll();
  layout();
  if (open >= 0) paint(big, open);
}
window.addEventListener("resize", syncMode);
syncMode();
layout();
window.__closet = {
  openG: openG,
  step: step,
  closeG: closeG,
  setHov: function (k) { hov = k; layout(); }
};
</script>
